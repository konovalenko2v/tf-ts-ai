name: Regression
run-name: Regression #${{ github.run_number }}

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Independent of test-shard: cheap and unrelated to Playwright, so it runs in parallel rather
  # than as a step inside a 2-way sharded matrix (which would run it twice for no reason). Scans
  # the diff on a PR (fetch-depth: 0 + GITLEAKS_CONFIG below restricts detection to the PR's own
  # commits, not the whole repo history) and the full push on master. Catches what CLAUDE.md rule
  # #4 ("nothing hardcoded") states as policy but that only pr-reviewer (an AI call, not
  # deterministic) currently checks for — this is the same requirement, enforced deterministically.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ReportPortal is opt-in (see docker/reportportal/) — no instance is wired into CI today, so
  # RP_ENDPOINT is unset here and this job is always skipped; vars (not secrets) because an
  # endpoint URL isn't sensitive, matching how playwright.config.ts reads it locally. When someone
  # does deploy a shared instance CI can reach, setting the repo variable (and RP_API_KEY /
  # RP_PROJECT secrets) is the only wiring needed — nothing here or in test-shard changes.
  #
  # Exists because test-shard is a matrix — each shard is its own Playwright process, and without
  # a shared launch each would call playwright.config.ts's ReportPortal reporter independently and
  # start its OWN launch, giving one ReportPortal launch per shard instead of one for the whole
  # run. Starting the launch once, here, and handing every shard the same ID (via RP_LAUNCH_ID)
  # is the fix the agent's own docs recommend for sharded runs — see
  # node_modules/@reportportal/agent-js-playwright/README.md, "Using the launchId config option".
  rp-launch-start:
    if: vars.RP_ENDPOINT != ''
    runs-on: ubuntu-latest
    outputs:
      launch_id: ${{ steps.start.outputs.launch_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Start ReportPortal launch
        id: start
        run: npx tsx src/reportportal/start-launch.ts
        env:
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_LAUNCH: 'tf-ts-ai CI #${{ github.run_number }}'

  # Sharding example (shard count = 1 for now — a real split just raises `shard-count` below).
  # This job runs the suite in N parallel slices; `test` (further down) is the aggregate that
  # merges their reports and is what branch protection actually requires — see that job's own
  # comment for why the names are split this way.
  test-shard:
    needs: rp-launch-start
    # `needs` alone would skip this whole job when rp-launch-start is itself skipped (the normal
    # case, RP_ENDPOINT unset) — always() plus the explicit result check keeps test-shard running
    # in that case and only fails it if rp-launch-start actually ran and failed.
    if: |
      always() &&
      (needs.rp-launch-start.result == 'success' || needs.rp-launch-start.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # To actually split the suite across N jobs, raise BOTH lists together, e.g. for 4 shards:
      # shard: [1, 2, 3, 4], shard-count: [4]. This is a cartesian product (matrix), not a paired
      # zip — editing only `shard` runs the full suite N times over instead of splitting it.
      matrix:
        shard: [1, 2]
        shard-count: [2]
    steps:
      # fetch-depth: 0 — test:affected diffs the PR branch against origin/<base>, which needs
      # the base branch's history present locally; the default shallow (depth-1) checkout only
      # has this branch's own commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsx (every npm script here) strips types without checking them, and Playwright's own runner
      # does the same — so nothing else in this pipeline would catch a type error before it reached
      # master. Runs before the browser install (which takes ~1 min) so a type error fails fast.
      # Only on shard 1: a repo-wide check, not something sharding the tests should multiply.
      - name: Type check
        if: matrix.shard == 1
        run: npm run typecheck

      # eslint.config.mjs treats the pre-existing `response.json()` -> any warnings as warnings, so
      # this gate is about NEW errors only (floating promises, unsafe non-null handling): --max-warnings
      # is deliberately not set to 0 while that backlog stands, otherwise the gate would be red on
      # arrival and get ignored.
      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Format check
        if: matrix.shard == 1
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # PRs run only the tests the import graph says the diff can affect (src/test-selection/) —
      # cheaper feedback on a branch that hasn't merged yet. push/workflow_dispatch against master
      # always run the full suite: a false negative on master itself is the one outcome this
      # optimization must never risk.
      #
      # Sharding (--shard) only applies on the push/master branch below. test:affected
      # (src/test-selection/) is a tsx wrapper that calls Playwright with its own fixed argv — it
      # does not forward extra CLI flags — so at shard-count > 1 a PR would still run its whole
      # affected list on every shard. Left as a known gap rather than silently running the full
      # suite on PRs, which would reverse the affected-only optimization this comment used to
      # describe alone. The blob reporter needed to merge shards below comes from
      # playwright.config.ts (CI-gated), not a CLI flag here, precisely because test:affected
      # can't be handed one.
      #
      # Dependabot PRs are routed to unit-only: GitHub gives Dependabot-triggered runs a separate,
      # normally-empty secret store (Settings > Secrets > Dependabot, not Actions) — USER_PASSWORD/
      # BOOK_STORE_* resolve to '' there regardless of what's set under Actions. Every Dependabot
      # diff also touches package-lock.json, one of test:affected's own FALLBACK_TRIGGERS
      # (src/test-selection/affected-tests.ts), so it would otherwise always resolve to a full,
      # unscoped `playwright test` run — putting `api` in globalSetup's scope and failing on the
      # missing credential before a single test executes, not on anything the dependency bump
      # actually changed. unit/lint/typecheck/format (this job, shard 1) still run in full and are
      # what carries real signal for a dependency bump; api/graphql/ui exercise external services
      # (restful-booker, demoqa, Hygraph), not the bumped package, with one known exception — a
      # @playwright/test bump is exactly the case where the ui project would have signal that this
      # skips. Fixing the Dependabot secret store (mirroring the 3 secrets there) would remove this
      # carve-out entirely; until then this keeps Dependabot PRs green on the parts credentials
      # can't gate rather than red on missing infrastructure.
      - name: Run tests
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm run test:unit
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:affected
          else
            npm test -- --shard=${{ matrix.shard }}/${{ matrix.shard-count }}
          fi
        env:
          BOOKER_USERNAME: ${{ vars.BOOKER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          BOOK_STORE_USERNAME: ${{ secrets.BOOK_STORE_USERNAME }}
          BOOK_STORE_PASSWORD: ${{ secrets.BOOK_STORE_PASSWORD }}
          SELF_HEAL: '1'
          AI_PROVIDER: 'google'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: 'gemini-3.6-flash'
          AI_MODEL_FALLBACK: 'gemini-3.5-flash'
          # Empty string (not unset) when rp-launch-start was skipped — playwright.config.ts only
          # adds the ReportPortal reporter when RP_ENDPOINT is truthy, so an empty RP_LAUNCH_ID
          # alongside it is harmless and never reached.
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_LAUNCH_ID: ${{ needs.rp-launch-start.outputs.launch_id }}

      - name: Failure analysis
        if: always()
        run: npm run failure-analysis

      # Per-shard blob report and raw allure-results, merged in the `test` summary job below.
      # Suffixed with the shard number since upload-artifact rejects a second upload under the
      # same name — invisible at shard-count 1, but required the moment it's raised past 1.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore

      # Read by the fixer job below — kept separate from the Pages artifact since it's
      # machine-readable input for agent-fixer, not part of the human-facing report.
      - name: Upload observability data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observability-${{ matrix.shard }}
          path: .observability/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload healwright cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-heal-cache-${{ matrix.shard }}
          path: .self-heal/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # The aggregate over test-shard's matrix — named `test` (not `test-summary`) on purpose: this is
  # the name branch protection's required status check and every downstream `needs: test` below
  # (deploy, jira-triage, agent-fixer, agent-fixer-rollback, agent-fixer-verify-and-merge) already
  # point at. Sharding the run must not mean renaming the check GitHub and this file both depend
  # on — that would require a repo branch-protection settings change (and the same required-check
  # deadlock worked through earlier for pr-review) just to add a sharding example.
  test:
    if: always()
    # rp-launch-start added alongside test-shard so this job can read its launch_id output (the
    # ReportPortal launch link step below needs it) — GitHub Actions only exposes another job's
    # outputs to jobs that list it in needs, even transitively-reached ones.
    needs: [test-shard, rp-launch-start]
    runs-on: ubuntu-latest
    # Top-level permissions grants contents: read/pages: write/id-token: write only — the PR
    # comment step below (posting a link to the report artifact) needs pull-requests: write too.
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # continue-on-error: a shard that never uploaded (crashed before that step, or a PR run
      # with no shards at all) leaves zero matches for this pattern — the "Gate on shard results"
      # step at the end is what actually fails this job, not an empty download here.
      # NOT merge-multiple here, unlike the allure/observability downloads below — Playwright's
      # blob reporter names every shard's zip identically (report.zip regardless of --shard), so
      # merge-multiple would land both shards' artifacts at the same all-blob-reports/report.zip
      # path. GitHub downloads matched artifacts concurrently; two concurrent writes to one path
      # raced and produced a zip merge-reports itself couldn't read ("too many bytes in the
      # stream. expected 1519001. got at least 1522225" — one shard's byte count, the other
      # shard's partially-overwritten content). Downloading into per-artifact subdirectories
      # (the default without merge-multiple) avoids the collision; the next step flattens them
      # into uniquely-named files before merge-reports runs.
      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: blob-report-*
          path: all-blob-reports-raw

      # merge-reports only looks for zip files directly inside the directory it's given, not
      # recursively — so the per-artifact subdirectories from the download above (blob-report-1/
      # report.zip, blob-report-2/report.zip) have to be flattened into distinctly-named files in
      # one flat directory first, or it reports "No report files found".
      - name: Flatten blob reports into distinctly-named files
        if: always()
        run: |
          mkdir -p all-blob-reports
          shopt -s nullglob
          for dir in all-blob-reports-raw/*/; do
            name="$(basename "$dir")"
            for zip in "$dir"*.zip; do
              cp "$zip" "all-blob-reports/${name}.zip"
            done
          done

      # continue-on-error: a shard that crashed before writing any blob file (e.g. browser install
      # failed) legitimately leaves all-blob-reports/ empty — merge-reports on an empty directory
      # must not take down the report-publishing steps below; "Gate on shard results" at the end
      # is what actually fails this job on a red shard, not this step.
      - name: Merge blob reports into HTML report
        if: hashFiles('all-blob-reports/**') != ''
        continue-on-error: true
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      # Surfaces the merge-reports output itself, since that's the artifact this sharding example
      # was asked to demonstrate — separate from the Allure report below, which is what Pages
      # actually serves.
      - name: Upload merged Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Download allure results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Informational only, not a merge gate — c8/V8 coverage over the unit project only (the
      # only project with in-repo src/ code to instrument; api/graphql/ui exercise external
      # services, not this codebase). Runs regardless of shard outcome so a PR still gets a
      # coverage number even when an unrelated api/ui test on some shard is red.
      #
      # Runs BEFORE "Download observability data" below, on purpose: `npm run coverage` invokes
      # `playwright test --project=unit --project=contract` for real, which writes its own
      # .observability/run-*.jsonl via the same reporter every other run uses — indistinguishable
      # by filename from a shard's file. Downloading the shard files first and running coverage
      # second silently inflated the dashboard's totals by this job's own re-run of the 172
      # unit+contract tests (double-counted on top of what test-shard already ran and uploaded).
      # Order now guarantees .observability/ holds only the two shards' files when the dashboard
      # step reads it.
      - name: Coverage report (unit)
        if: always()
        # pipefail: without it the step's exit code comes from `tee`, which always succeeds — a
        # coverage run that crashed outright would still report as a green step with an empty
        # summary. The report itself is informational (no threshold gate), but "the tool failed to
        # run" and "the tool ran and found low coverage" must not look identical.
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-output.txt
          {
            echo "## Test coverage (unit)"
            echo '```'
            tail -n 20 coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # rm -rf first: coverage above just wrote its own .observability/run-*.jsonl (same reporter,
      # indistinguishable filename from a shard's) — merge-multiple only adds files, it doesn't
      # clear the directory first, so without this the dashboard step would double-count that run
      # on top of the two shards' real files downloaded here. Same pattern as the Allure download
      # below — one directory per shard, merged. Feeds the dashboard step further down; the
      # dashboard namespaces testId by runId before dedupe precisely because these are the raw
      # per-shard files (see dashboard.ts's namespaceTestIds comment).
      - name: Clear observability dir before downloading shard files
        if: always()
        run: rm -rf .observability

      - name: Download observability data
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: observability-*
          path: .observability
          merge-multiple: true

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # Runs after generate because the report's own uid tree (allure-report/data/suites.json)
      # is what this reads to build a #suites/<suiteUid>/<testUid>/ link — those uids don't exist
      # before this point, and computing them independently isn't reliable (Allure2 hashes uids
      # internally; not something to re-derive from raw titles).
      - name: Link self-healed tests in step summary
        if: always()
        run: npm run link-healed-tests
        env:
          ALLURE_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # Second, separate page on the same Pages site (allure-report/dashboard/index.html) — must
      # run after "Generate Allure Report" since that step's --clean wipes allure-report/ first,
      # and before "Upload Pages artifact" since that's what ships the directory. continue-on-error:
      # a dashboard bug must never turn the required `test` check red over a report-only page —
      # same spirit as CLAUDE.md rule #5 for the AI review gate.
      - name: Generate failure dashboard
        if: always()
        continue-on-error: true
        run: npm run dashboard -- allure-report/dashboard

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'allure-report'

      # RP_ENDPOINT is today a placeholder (localhost:8090, docker/reportportal/) — a CI runner is
      # a cloud VM with no route to the machine running that container, so rp-launch-start itself
      # is skipped (see its own if:) and this step's link is a dead link until RP_ENDPOINT is
      # replaced with a publicly-reachable address (repo variable, Settings > Secrets and
      # variables > Actions > Variables). Kept anyway — wiring the URL shape (endpoint origin +
      # project + launch_id, ReportPortal's own #/<project>/launches/all/<id> route) once now means
      # the day RP_ENDPOINT becomes real, this starts working with no further workflow change.
      - name: Build ReportPortal launch link
        if: always() && needs.rp-launch-start.outputs.launch_id != ''
        run: |
          RP_ORIGIN="${RP_ENDPOINT%/api/v2}"
          LAUNCH_URL="${RP_ORIGIN}/ui/#${RP_PROJECT}/launches/all/${LAUNCH_ID}"
          echo "RP_LAUNCH_URL=${LAUNCH_URL}" >> "$GITHUB_ENV"
          echo "🔗 [ReportPortal launch](${LAUNCH_URL})" >> "$GITHUB_STEP_SUMMARY"
        env:
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          LAUNCH_ID: ${{ needs.rp-launch-start.outputs.launch_id }}

      # deploy (a separate job further down, needs: test) publishes to Pages AFTER this job
      # finishes — the live URL doesn't exist yet when this step runs, so it can't be linked here.
      # Also worth knowing: deploy now runs on every branch (widened from master-only after the
      # environment's deployment-branch-policy was changed to '*'), but Pages serves exactly one
      # URL per repo — whichever run deploys last wins the live site, PR or not. The artifact
      # download link below is the only way to reliably see THIS run's report once a later run
      # (any branch) has deployed over it. One comment per run (search-then-update), not one per
      # push, so re-running doesn't pile up duplicate comments on a long-lived PR.
      - name: Comment PR with report download link
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # RP_LAUNCH_URL itself comes from GITHUB_ENV (the "Build ReportPortal launch link" step
        # above), not this step's own env: block — a step's GITHUB_ENV writes are already visible
        # as plain shell vars to every later step in the same job, no explicit passthrough needed.
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          DASHBOARD_URL="${PAGES_URL}dashboard/"
          # README.md#anchor is NOT a relative link once rendered inside an issue/PR comment (unlike
          # inside the file itself) — GitHub renders it as a literal relative href, which resolves
          # against the comment's own URL (.../pull/45) to something like .../pull/README.md, a 302
          # to nowhere. Needs the full /blob/<branch>/ URL to actually work from a comment.
          README_URL="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.head_ref }}/README.md#test-health-dashboard"
          MARKER="<!-- report-artifact-link -->"
          RP_LINE=""
          if [ -n "$RP_LAUNCH_URL" ]; then
            RP_LINE="
          🔗 [ReportPortal launch](${RP_LAUNCH_URL})"
          fi
          BODY="${MARKER}
          📊 Test report: **[live dashboard](${DASHBOARD_URL})** · [live Allure](${PAGES_URL}) — deploys after this job finishes, and is shared across the whole repo (one site, not one per PR), so a later run on any branch may overwrite these before you look. For THIS run specifically, reliable regardless of later runs: **[download from the run's Artifacts section](${RUN_URL})**. ([What the dashboard shows](${README_URL}).)${RP_LINE}"

          # gh pr view --json comments returns each comment's GraphQL node id (IC_...), not the
          # numeric id the REST PATCH endpoint below needs — go straight to the REST issues/comments
          # list instead, which is numeric-id-native (a PR is an issue for this API).
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -f body="$BODY"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi

      # The real gate: without this, a red shard would still leave the required `test` check
      # green (this job's own steps above all succeed regardless of shard outcome — merging and
      # reporting on a failed run is exactly when a human needs to see the report). Placed after
      # publishing so the report still comes out on a red run, same always()-then-gate pattern the
      # single-job version used with its own `if: always()` steps.
      - name: Gate on shard results
        if: needs.test-shard.result != 'success'
        run: exit 1

      # Quarantine candidates (quarantine-candidates.json, from failure-analysis) are proposals
      # only — a human promotes one into quarantine.json by hand. This step does not touch that
      # promotion decision; it only refuses to let an *already-quarantined* entry sit forever once
      # its TTL passes, so quarantine.json can't quietly become a permanent graveyard. Runs
      # regardless of the shard gate above so an expired entry is reported even on an otherwise
      # green run.
      - name: Check quarantine TTL
        if: always()
        run: npm run check-quarantine-ttl

  # Counterpart to rp-launch-start. Runs regardless of test's own outcome (always()) so a red run
  # still gets its ReportPortal launch closed out — an unfinished launch sits as IN_PROGRESS
  # forever otherwise, which is worse than a launch correctly marked failed.
  rp-launch-finish:
    if: always() && needs.rp-launch-start.result == 'success'
    needs: [rp-launch-start, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Finish ReportPortal launch
        run: npx tsx src/reportportal/finish-launch.ts
        env:
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_LAUNCH_ID: ${{ needs.rp-launch-start.outputs.launch_id }}

  # Deploys on every run now, PR included — the github-pages environment's deployment branch
  # policy was widened from master-only to '*' (gh api .../environments/github-pages/
  # deployment-branch-policies) specifically to unblock this. One real tradeoff worth knowing:
  # Pages has exactly one live URL per repo (https://<owner>.github.io/<repo>/), not one per PR —
  # whichever run deploys last (any branch) is what that URL serves. Two PRs' CI running close
  # together will each overwrite the other's live report; the artifact download link in the PR
  # comment (see "Comment PR with report download link" above) is still the only way to see a
  # SPECIFIC PR's report reliably once a later run has deployed over it.
  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # AI review of the PR's full diff against this repo's stated rules (src/ai-agents/pr-reviewer.ts,
  # ai-agents/personas/pr-reviewer.md) — the merge gate for every PR, whoever opened it.
  #
  # Deliberately NOT `needs: test`. The reviewer reads `gh pr diff`, not a test artifact, so gating
  # it on the test job would only make the review skip (or wait) exactly when tests are red — which
  # is when a second opinion is most useful, not least. It also gets the signal to the author sooner.
  #
  # Exits nonzero ONLY on a `major` finding. A missing AI_API_KEY, an exhausted Gemini quota, or
  # output the persona's grammar can't parse all exit 0 with a loud "review unavailable" comment —
  # those are facts about the infrastructure, not about the PR, and a check that goes red for
  # reasons the author cannot act on is a check people learn to ignore. See pr-reviewer.ts's header
  # for the full exit-code contract.
  #
  # NOTE: making this a *required* check (so GitHub itself refuses the merge button) is a branch-
  # protection setting in the repo's GitHub settings — it cannot be turned on from a file in the
  # repo. Until a human enables it for `master`, this job blocks the autonomous agent-fixer path
  # below (via `needs`) but only advises a human clicking merge.
  pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Top-level `permissions:` grants contents: read only — the verdict comment needs this.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review PR diff
        run: npm run pr-review -- "${{ github.event.pull_request.number }}"
        env:
          # The default GITHUB_TOKEN is enough for `gh pr diff` / `gh pr comment` — no PAT needed,
          # unlike agent-fixer, which pushes branches and merges.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Set explicitly rather than inherited: AI_MODEL/AI_MODEL_FALLBACK are healwright's own
          # runtime healing allowance, and a review call quietly competing with self-healing for the
          # same quota is how one feature starts breaking the other. Same pattern as jira-triage.
          AI_MODEL: 'gemini-3.6-flash'
          AI_MODEL_FALLBACK: 'gemini-3.5-flash'

  # Collects Jira context for every assertion-category failure and asks for a bug-vs-feature-change
  # verdict, per src/jira-triage/. PR-only: the branch-name-to-Jira-key parse
  # (src/jira-triage/collect-context.ts) is meaningless on `master` itself (no ticket key in that
  # name), and this is meant to give a PR author an early "is this red because of the thing you're
  # changing" signal, not to gate merges. Gated on the test job having *run* (`always()`), same
  # reasoning as agent-fixer below — an unrelated api flake in the same PR run shouldn't block
  # triaging a real ui assertion failure.
  jira-triage:
    if: |
      always() &&
      needs.test.result != 'skipped' &&
      github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # continue-on-error: mirrors agent-fixer's reasoning below — a run where the test job
      # failed before ever writing .observability/ (or produced none, e.g. every failure was a
      # non-assertion category) legitimately has no artifact; run.ts already exits cleanly with
      # "nothing to triage" when latestRunFile() finds no run file.
      - name: Download observability data
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: observability-*
          path: .observability/
          merge-multiple: true

      - name: Run Jira triage
        run: npm run jira-triage
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: 'gemini-3.6-flash'
          AI_MODEL_FALLBACK: 'gemini-3.5-flash'
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  # Proposes a fix (as a PR) when a test passed only because healwright silently recovered a
  # broken locator at runtime. Gated on the test job having *run* (`always()`), not on it having
  # *passed* — the api/graphql projects hit an unstable external service (restful-booker) often
  # enough that gating on overall job success would mean a UI recovery never gets fixed just
  # because an unrelated api test flaked in the same run. agent-fixer's own script exits cleanly
  # with nothing to do when .observability/ has no passed_with_recovery records, so running it
  # unconditionally here is safe — it just costs an extra job start on runs with nothing to fix.
  # Allowed triggers are `push` and manual `workflow_dispatch` against master — both only ever
  # target master (there's no UI to manually dispatch against an agent-fixer/* branch, and
  # `push: branches: [master]` means a push to that branch never triggers this workflow at all),
  # so the loop guard holds for both: a fixer PR cannot spawn another fixer run.
  agent-fixer:
    if: |
      always() &&
      needs.test.result != 'skipped' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.FIXER_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needed only for the AI-fallback layer (cache-layer fixes need no AI call at all).
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # continue-on-error: a run with nothing to fix (e.g. no UI recovery this time) legitimately
      # produces an empty/missing artifact — run.ts already exits 0 in that case, so the download
      # step failing must not fail the job ahead of that clean no-op path.
      - name: Download observability data
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: observability-*
          path: .observability/
          merge-multiple: true

      - name: Download healwright cache
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: self-heal-cache-*
          path: .self-heal/
          merge-multiple: true

      - name: Run agent-fixer
        run: npm run agent-fixer
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}
          GIT_AUTHOR_NAME: agent-fixer
          GIT_AUTHOR_EMAIL: agent-fixer@users.noreply.github.com
          GIT_COMMITTER_NAME: agent-fixer
          GIT_COMMITTER_EMAIL: agent-fixer@users.noreply.github.com
          GEMINI_API_KEY: ${{ secrets.AI_API_KEY }}

  # Stability gate + auto-merge for agent-fixer's own PRs (see run.ts's `gh pr create` step).
  # Triggered by the SAME `pull_request` event `test` already runs on, scoped down to branches
  # named agent-fixer/* — this does not re-trigger the loop guard in the `agent-fixer` job above
  # (that job only ever fires on push/workflow_dispatch against master, never on a PR event), so
  # a fixer PR still cannot spawn another fixer run.
  #
  # A locator fix passing once (the `test` job's own affected-tests run) proves nothing about a
  # healed selector's actual stability — self-healing exists precisely because these locators
  # already misbehave once. Per the project owner's explicit requirement: every affected test must
  # pass 5 consecutive repeats, AND the whole affected spec file must pass 2 consecutive full runs,
  # before this ever calls `gh pr merge`. See verify-stability.ts for the exact gate.
  # Only PRs from an 'agent-fixer/cache/' branch reach this job at all — run.ts routes there ONLY
  # when every fix in the PR came from the healwright cache (a runtime-recorded strategy), never
  # when any fix came from the AI fallback (freshly generated code with no such evidence). An
  # 'agent-fixer/ai/' branch simply never matches this trigger and stays a normal PR for a human.
  agent-fixer-verify-and-merge:
    # Unlike the `test` job's own always()-based continue-on-error reasoning (an unrelated api
    # flake shouldn't block a human-facing report), this gate guards an UNREVIEWED merge to
    # master — it must only proceed when the PR's own CI actually passed.
    #
    # pr-review is in `needs` because this is the ONE path in the repo that merges to master with
    # no human at any point — so it is exactly the path an AI review gate exists to cover. Branch
    # protection cannot help here: `gh pr merge` run by this job is the merge, and a required check
    # would be satisfied by this same workflow anyway. Requiring `success` (not just `!= 'skipped'`)
    # means a `major` finding stops the auto-merge outright. pr-reviewer exits 0 when the review
    # could not RUN (no key, quota exhausted, unparseable reply — see its header), so a quota blip
    # does not deadlock autonomy; only an actual blocking finding does.
    if: |
      needs.test.result == 'success' &&
      needs['pr-review'].result == 'success' &&
      needs['secret-scan'].result == 'success' &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'agent-fixer/cache/')
    needs: [test, pr-review, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.FIXER_PAT }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Circuit breaker: a count of recent auto-merges alone doesn't catch "fixing the same thing
      # over and over" — any REVERTED agent-fixer commit in the window trips it immediately,
      # regardless of count, since a revert is direct evidence the last autonomous merge was wrong.
      # Deliberately does not exit nonzero on trip: that would be indistinguishable from a
      # stability failure to a human skimming the job list, but "autonomy suspended, needs a human
      # look" is a different condition than "this specific fix is unstable."
      - name: Circuit breaker (recent auto-merge history)
        id: breaker
        run: npm run agent-fixer:circuit-breaker

      - name: Hold PR open — circuit breaker tripped
        if: steps.breaker.outputs.tripped == 'true'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "🛑 Auto-merge held: ${{ steps.breaker.outputs.reason }}"
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}

      - name: Install Playwright browsers
        if: steps.breaker.outputs.tripped != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify stability (5x per test, 2x per suite)
        if: steps.breaker.outputs.tripped != 'true'
        run: npm run agent-fixer:verify-stability
        env:
          BOOKER_USERNAME: ${{ vars.BOOKER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          SELF_HEAL: '1'
          AI_PROVIDER: 'google'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: 'gemini-3.6-flash'
          AI_MODEL_FALLBACK: 'gemini-3.5-flash'

      # Only reached if the breaker is clear AND verify-stability exited 0 — a failing step above
      # stops the job here via GitHub Actions' default fail-fast behavior, so this line is never
      # reached on an unstable fix or a suspended-autonomy window. --squash keeps master's history
      # to one commit per fixer PR, matching how a human reviewer would normally land a small fix.
      - name: Auto-merge (stable across all repeats)
        if: steps.breaker.outputs.tripped != 'true'
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}

  # Rollback safety net for the auto-merge above: verify-stability running the affected specs in
  # isolation (this branch, no other concurrent changes) cannot catch every failure mode — e.g. an
  # interaction with something unrelated that merged to master in between, or an environment
  # difference between the PR checkout and master itself. If the FULL master suite (the `test` job
  # above, unconditional push trigger) goes red immediately after an agent-fixer squash-merge, this
  # auto-reverts that commit and reopens the story as a human-owned issue — never silently retried,
  # never re-attempted by agent-fixer itself (that would risk a revert/re-fix loop).
  agent-fixer-rollback:
    # NOTE: matching on head_commit.author.name == 'agent-fixer' does NOT work here — a squash
    # merge via `gh pr merge` is authored by the PR author / token identity as far as GitHub's
    # commit metadata is concerned, not by the GIT_AUTHOR_NAME env set on the branch's own commits.
    # The reliable signal is the squash commit message, which defaults to the PR title — and
    # run.ts's `gh pr create --title` always starts that title with 'agent-fixer:'.
    #
    # Gated on test-shard's own result, not just test's: the `test` summary job's gate step
    # (`exit 1` on any non-success shard) binarizes a CANCELLED or SKIPPED shard run into
    # `test.result == 'failure'` too, same as a genuine red suite. Reverting a real commit on a
    # cancelled run would be wrong, so this checks test-shard directly for an actual failure.
    if: |
      always() &&
      needs.test-shard.result == 'failure' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      startsWith(github.event.head_commit.message, 'agent-fixer:')
    needs: [test, test-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.FIXER_PAT }}
          fetch-depth: 0

      - name: Configure git identity for the revert commit
        run: |
          git config user.name "agent-fixer"
          git config user.email "agent-fixer@users.noreply.github.com"

      - name: Revert the auto-merged commit
        run: git revert --no-edit "${{ github.sha }}"

      - name: Push revert
        run: git push origin HEAD:master
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}

      - name: Reopen as a human-owned issue
        run: |
          gh issue create \
            --title "agent-fixer auto-merge reverted: ${{ github.sha }}" \
            --body-file - <<'EOF'
          Commit ${{ github.sha }} (agent-fixer, auto-merged after passing its own stability gate
          — see the agent-fixer-verify-and-merge job on its PR) failed the full master regression
          suite and has been automatically reverted.

          This means the fix passed 5x per-test + 2x per-suite in isolation on its own branch, but
          broke something once merged onto master's actual current state (unrelated concurrent
          change, or environment difference) — the stability gate is not infallible, hence this
          safety net.

          The original healwright recovery this was meant to fix is still present (revert restores
          the pre-fix locator). Needs a human to re-diagnose — do not just re-run agent-fixer
          blindly, since it may propose the same fix again.
          EOF
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}
