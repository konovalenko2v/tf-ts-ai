name: Regression
run-name: Regression #${{ github.run_number }}

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          BOOKER_USERNAME: ${{ vars.BOOKER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          SELF_HEAL: '1'
          AI_PROVIDER: 'google'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: 'gemini-3.6-flash'
          AI_MODEL_FALLBACK: 'gemini-3.5-flash'

      - name: Failure analysis
        if: always()
        run: npm run failure-analysis

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      # Read by the fixer job below — kept separate from the Pages artifact above since it's
      # machine-readable input for agent-fixer, not part of the human-facing report.
      - name: Upload observability data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability
          path: .observability/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload healwright cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-cache
          path: .self-heal/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Proposes a fix (as a PR) when a test passed only because healwright silently recovered a
  # broken locator at runtime. Gated on the test job having *run* (`always()`), not on it having
  # *passed* — the api/graphql projects hit an unstable external service (restful-booker) often
  # enough that gating on overall job success would mean a UI recovery never gets fixed just
  # because an unrelated api test flaked in the same run. agent-fixer's own script exits cleanly
  # with nothing to do when .observability/ has no passed_with_recovery records, so running it
  # unconditionally here is safe — it just costs an extra job start on runs with nothing to fix.
  # Allowed triggers are `push` and manual `workflow_dispatch` against master — both only ever
  # target master (there's no UI to manually dispatch against an agent-fixer/* branch, and
  # `push: branches: [master]` means a push to that branch never triggers this workflow at all),
  # so the loop guard holds for both: a fixer PR cannot spawn another fixer run.
  agent-fixer:
    if: |
      always() &&
      needs.test.result != 'skipped' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FIXER_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needed only for the AI-fallback layer (cache-layer fixes need no AI call at all).
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # continue-on-error: a run with nothing to fix (e.g. no UI recovery this time) legitimately
      # produces an empty/missing artifact — run.ts already exits 0 in that case, so the download
      # step failing must not fail the job ahead of that clean no-op path.
      - name: Download observability data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: observability
          path: .observability/

      - name: Download healwright cache
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: self-heal-cache
          path: .self-heal/

      - name: Run agent-fixer
        run: npm run agent-fixer
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}
          GIT_AUTHOR_NAME: agent-fixer
          GIT_AUTHOR_EMAIL: agent-fixer@users.noreply.github.com
          GIT_COMMITTER_NAME: agent-fixer
          GIT_COMMITTER_EMAIL: agent-fixer@users.noreply.github.com
          GEMINI_API_KEY: ${{ secrets.AI_API_KEY }}
