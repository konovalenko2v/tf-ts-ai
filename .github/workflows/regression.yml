name: Regression
run-name: Regression #${{ github.run_number }}

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          BOOKER_USERNAME: ${{ vars.BOOKER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          SELF_HEAL: '1'
          AI_PROVIDER: 'google'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: 'gemini-3.6-flash'

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      # Read by the fixer job below — kept separate from the Pages artifact above since it's
      # machine-readable input for agent-fixer, not part of the human-facing report.
      - name: Upload observability data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability
          path: .observability/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload healwright cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-cache
          path: .self-heal/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Proposes a fix (as a PR) when a test passed only because healwright silently recovered a
  # broken locator at runtime. Runs only on pushes to master — not on PRs, and not when the
  # triggering branch is itself an agent-fixer branch, to avoid a fixer-PR -> CI -> fixer loop.
  agent-fixer:
    if: |
      always() &&
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.head_ref, 'agent-fixer/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FIXER_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download observability data
        uses: actions/download-artifact@v4
        with:
          name: observability
          path: .observability/

      - name: Download healwright cache
        uses: actions/download-artifact@v4
        with:
          name: self-heal-cache
          path: .self-heal/

      - name: Run agent-fixer
        run: npm run agent-fixer
        env:
          GH_TOKEN: ${{ secrets.FIXER_PAT }}
          GIT_AUTHOR_NAME: agent-fixer
          GIT_AUTHOR_EMAIL: agent-fixer@users.noreply.github.com
          GIT_COMMITTER_NAME: agent-fixer
          GIT_COMMITTER_EMAIL: agent-fixer@users.noreply.github.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
